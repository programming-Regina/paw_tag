{% extends "base.html" %}

{% block title %}
{{ mascota.nombre_mascota }}
{% endblock %}

{% block content %}

<div class="card-mascota">

    <h1>{{ mascota.nombre_mascota }}</h1>

    <div class="observaciones">
        <h3>Observaciones</h3>
        <p>{{ mascota.observaciones }}</p>
    </div>

    <a
        href="https://wa.me/{{ mascota.telefono_contacto }}?text={{ mensaje_whatsapp }}"
        class="btn btn-whatsapp"
    >
        💬 Enviar WhatsApp
    </a>

    <a
        href="/editar/{{ mascota.id }}"
        class="btn btn-outline"
    >
        Editar datos de la mascota
    </a>

        <div class="mensaje-cuidado">
        🐾 Gracias por cuidar de mí
    </div>

</div>



{% endblock %}
