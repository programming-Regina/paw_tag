<!DOCTYPE html>
{% extends "base.html" %}

{% block title %}
Registrar Mascota
{% endblock %}

{% block content %}

<form action="{{ url_for('alta_mascota', id_tag=id_tag) }}" method="POST">
    <h3 class="sin-registrar">PawTag no registrado</h3>

<p>
    Este tag NFC todavía no está asociado a ninguna mascota.
    Complete el formulario para registrarla.<br><strong>Todos los campos son obligatorios.</strong>
</p>
    <label>Nombre</label><br>
    <input type="text" name="nombre_mascota" placeholder="Nombre de la mascota" required><br><br>

    <label>Observaciones</label><br>
    <textarea name="observaciones" placeholder="Ej: Es asustadizo, toma medicación, responde a su nombre, puede morder si tiene miedo." required></textarea><br><br>

    <label>Teléfono</label><br>
    <input type="text" name="telefono_contacto" placeholder="Ej: 11 1234-5678" required><br><br>

    <label>Email</label><br>
    <input type="email" name="email_contacto" placeholder="correo@ejemplo.com" required><br><br>

    <button type="submit">Guardar</button>
</form>
{% endblock %}
