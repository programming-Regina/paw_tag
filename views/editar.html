{% extends "base.html" %}

{% block title %}
Editar Mascota
{% endblock %}

{% block content %}

<div class="card-mascota">

    <h2>
        Editar Mascota
    </h2>

    <form method="POST" action="/guardar_edicion/{{ mascota.id }}" novalidate>

        <label for="nombre_mascota">
            Nombre
        </label>

        <input
            type="text"
            id="nombre_mascota"
            name="nombre_mascota"
            value="{{ mascota.nombre_mascota }}"
            required
        >

        <label for="observaciones">
            Observaciones
        </label>

        <textarea
            id="observaciones"
            name="observaciones"
            required
        >{{ mascota.observaciones }}</textarea>

        <label for="telefono_contacto">
            Teléfono

            {% if errores and errores.telefono_contacto %}
            <span class="error-campo">
                {{ errores.telefono_contacto }}
            </span>
            {% endif %}
        </label>

        <input
            type="text"
            id="telefono_contacto"
            name="telefono_contacto"
            value="{{ mascota.telefono_contacto }}"
            class="{% if errores and errores.telefono_contacto %}input-error{% endif %}"
            required
        >

        <label for="email_contacto">
            Email

            {% if errores and errores.email_contacto %}
            <span class="error-campo">
                {{ errores.email_contacto }}
            </span>
            {% endif %}
        </label>

        <input
            type="email"
            id="email_contacto"
            name="email_contacto"
            value="{{ mascota.email_contacto }}"
            class="{% if errores and errores.email_contacto %}input-error{% endif %}"
            required
        >

        <button type="submit">
            Guardar cambios
        </button>

    </form>

</div>

{% endblock %}
